name: Build & Test Micronaut App

on:
  pull_request:
    branches: [ "main" ]
    types: [closed]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testdb
        options: --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      # Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Wait for MySQL to fully start (increased retries)
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do  # Increased retries to 30
            if mysqladmin ping --host 10.11.12.28 --user root --password password --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 5
          done

      - name: Build & Test
        run: |
          ./gradlew clean build
          # "build" typically runs tests & creates the .jar in build/libs

      - name: Upload .jar artifact (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: micronaut-application-jar
          path: build/libs/*.jar
